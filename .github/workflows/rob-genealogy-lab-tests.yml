name: ROB Genealogy Lab tests

on:
  push:
    branches:
      - feature/rob-genealogy-lab
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Build tested alpha ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/rob-genealogy-lab'
        run: |
          rm -rf /tmp/rob-alpha
          mkdir -p /tmp/rob-alpha/ROB-Genealogy-Lab
          git archive --format=tar HEAD | tar -x -C /tmp/rob-alpha/ROB-Genealogy-Lab
          rm -rf /tmp/rob-alpha/ROB-Genealogy-Lab/.github
          cd /tmp/rob-alpha
          zip -qr "$GITHUB_WORKSPACE/ROB-Genealogy-Lab-Alpha.zip" ROB-Genealogy-Lab
      - name: Upload tested alpha ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/rob-genealogy-lab'
        uses: actions/upload-artifact@v4
        with:
          name: ROB-Genealogy-Lab-Alpha
          path: ROB-Genealogy-Lab-Alpha.zip
          if-no-files-found: error
          retention-days: 14
